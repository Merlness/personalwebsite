name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.1'
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          go mod download
          npm ci

      # Pin the templ CLI to the runtime version in go.mod; @latest generates
      # code against a newer runtime API and breaks the build.
      - name: Generate Templ
        run: go run github.com/a-h/templ/cmd/templ@v0.3.977 generate

      - name: Run Capture App Tests
        run: npm test

      - name: Build CSS
        run: npm run build-css -- --minify

      - name: Build Static Site
        run: go run cmd/ssg/main.go

      - name: Verify Dist
        run: ls -R dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
