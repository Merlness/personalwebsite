name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24'
        cache-dependency-path: go.sum

    # Pin the templ CLI to the runtime version in go.mod; @latest generates
    # code against a newer runtime API and breaks the build.
    - name: Install Templ
      run: go install github.com/a-h/templ/cmd/templ@v0.3.977

    - name: Generate Templ Files
      run: templ generate

    - name: Verify Dependencies
      run: go mod verify

    - name: Run Tests
      run: go test -v ./...

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Run Capture App Tests
      run: npm test
