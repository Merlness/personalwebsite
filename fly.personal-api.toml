# Fly config for merl-personal-api: the organizer PWA's GitHub proxy plus
# the /agent real-time endpoint. Personal org, scale-to-zero.
# Deploy with: fly deploy -c fly.personal-api.toml
app = "merl-personal-api"
# phx is deprecated for new Fly resources; lax is the nearest region.
primary_region = "lax"

[build]
  dockerfile = "Dockerfile.personal-api"

[env]
  ALLOWED_ORIGINS = "https://merlmartin.com,http://localhost:8000,http://localhost:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
